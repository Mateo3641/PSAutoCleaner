# ==============================================================================
# PSAutoCleaner Configuration
# Autonomous auto-cleaner companion addon for ProtectionStones (Paper 1.21+)
# ==============================================================================

# Enable or disable the autonomous periodic cleaner task
enabled: true

# Inactivity threshold required before claims qualify for cleanup.
# Supports flexible time units: s (seconds), m (minutes), h (hours), d (days), w (weeks), mo (months)
# Examples: "30d" (production), "14d", "12h", "3m" (testing)
# (Legacy 'inactive-days: 30' is also fully supported)
inactive-time: "30d"

# Cleanup action to perform:
# - remove  : Permanently delete claim region and break/remove protection stone block
cleanup-action: "remove"

# Repetitive background task scheduler configuration
scheduler:
  # How often the cleanup sweep runs automatically.
  # Supports any time duration: "24h" (once a day), "12h", "1h", "30m", "3m" (for fast testing)
  # (Legacy 'interval-hours: 24' is also fully supported)
  interval: "24h"

  # Delay before first execution after server start (avoids lag spikes on boot)
  # Examples: "10m", "5m", "1m", "30s"
  # (Legacy 'initial-delay-minutes: 10' is also fully supported)
  initial-delay: "10m"

# Target worlds where cleanup should run
# Leave empty ([]) to target ALL loaded worlds on the server.
# To specify worlds, remove the [] and list them like this:
# target-worlds:
#   - "world"
#   - "lobby"
target-worlds: []

# Send summary messages and cleanup logs to console
log-to-console: true

# Time format for countdown placeholders and messages
# Options: "verbose" (e.g. 29d 14h 32m), "short" (e.g. 29d 14h)
time-format: "short"

# Whether to check region members (added via /ps add) in addition to owners
# If true, a claim won't expire as long as at least ONE member or owner remains active
check-members: true
